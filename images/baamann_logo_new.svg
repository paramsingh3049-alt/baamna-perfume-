<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="260" height="180">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96a;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#f5e08a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8912a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square border frame -->
  <rect x="75" y="5" width="110" height="115" rx="0" ry="0"
        fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Inner thin border (double border effect) -->
  <rect x="81" y="11" width="98" height="103" rx="0" ry="0"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Large serif B letter -->
  <text x="130" y="86"
        font-family="Garamond, 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="80"
        font-weight="400"
        text-anchor="middle"
        fill="url(#goldGrad)"
        letter-spacing="0">B</text>

  <!-- BAAMANN text below the box -->
  <text x="130" y="148"
        font-family="'Montserrat', 'Futura', 'Trebuchet MS', Arial, sans-serif"
        font-size="22"
        font-weight="300"
        text-anchor="middle"
        fill="url(#goldGrad)"
        letter-spacing="6">BAAMANN</text>

  <!-- Thin gold rule under BAAMANN -->
  <line x1="60" y1="155" x2="200" y2="155"
        stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.7"/>
</svg>
