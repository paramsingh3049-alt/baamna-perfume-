<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <defs>
    <!-- Gold metallic gradient -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0d060"/>
      <stop offset="18%"  stop-color="#e8c040"/>
      <stop offset="35%"  stop-color="#d4a017"/>
      <stop offset="50%"  stop-color="#f5e070"/>
      <stop offset="65%"  stop-color="#c8960a"/>
      <stop offset="82%"  stop-color="#e8c040"/>
      <stop offset="100%" stop-color="#b8820a"/>
    </linearGradient>
    <!-- Gold text gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5e080"/>
      <stop offset="40%"  stop-color="#d4a820"/>
      <stop offset="70%"  stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#b8820a"/>
    </linearGradient>
  </defs>

  <!-- Double-B Monogram using overlapping geometric B shapes -->
  <!-- Outer B shape (spine + two lobes) -->
  <g fill="url(#goldMetal)">

    <!-- === OUTER B PATH === -->
    <!-- Spine (vertical bar) -->
    <rect x="155" y="30" width="28" height="220"/>

    <!-- Top horizontal bar -->
    <rect x="155" y="30" width="120" height="22"/>
    <!-- Bottom horizontal bar -->
    <rect x="155" y="228" width="120" height="22"/>
    <!-- Middle bar -->
    <rect x="155" y="127" width="100" height="20"/>

    <!-- Upper lobe right curve (approximated with rect + circle) -->
    <rect x="255" y="30" width="22" height="119"/>
    <rect x="235" y="108" width="42" height="42"/>

    <!-- Lower lobe right curve -->
    <rect x="265" y="147" width="22" height="103"/>
    <rect x="245" y="208" width="42" height="42"/>

    <!-- Upper lobe fill -->
    <rect x="183" y="52" width="94" height="97"/>

    <!-- Lower lobe fill -->
    <rect x="183" y="147" width="104" height="103"/>

  </g>

  <!-- Cutout inner shape (creates the hollow double-line effect) -->
  <g fill="black">
    <!-- Inner upper lobe cutout -->
    <rect x="193" y="62" width="65" height="65"/>
    <rect x="248" y="62" width="12" height="55"/>

    <!-- Inner lower lobe cutout -->
    <rect x="193" y="163" width="73" height="73"/>
    <rect x="256" y="163" width="14" height="60"/>
  </g>

  <!-- Inner highlight lines (double-line metallic effect) -->
  <!-- Spine inner right edge highlight -->
  <rect x="175" y="42" width="8" height="198" fill="url(#goldMetal)" opacity="0.5"/>

  <!-- Top bar inner highlight -->
  <rect x="175" y="42" width="100" height="7" fill="url(#goldMetal)" opacity="0.5"/>

  <!-- Bottom bar inner highlight -->
  <rect x="175" y="231" width="100" height="7" fill="url(#goldMetal)" opacity="0.5"/>

  <!-- Middle bar inner highlight -->
  <rect x="175" y="130" width="80" height="7" fill="url(#goldMetal)" opacity="0.5"/>

  <!-- BAAMANN text -->
  <text
    x="250"
    y="320"
    font-family="'Cormorant Garamond', 'Garamond', 'Times New Roman', Georgia, serif"
    font-size="52"
    font-weight="600"
    text-anchor="middle"
    fill="url(#goldText)"
    letter-spacing="14"
  >BAAMANN</text>

  <!-- Thin gold rule above text -->
  <line x1="80" y1="275" x2="420" y2="275" stroke="url(#goldMetal)" stroke-width="1" opacity="0.6"/>

</svg>
