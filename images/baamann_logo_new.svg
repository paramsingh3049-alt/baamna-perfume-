<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400">
  <defs>
    <!-- Main gold metallic gradient (vertical) -->
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f5e27a"/>
      <stop offset="15%"  stop-color="#d4980e"/>
      <stop offset="30%"  stop-color="#f0d050"/>
      <stop offset="50%"  stop-color="#c48810"/>
      <stop offset="70%"  stop-color="#e8c238"/>
      <stop offset="85%"  stop-color="#b87808"/>
      <stop offset="100%" stop-color="#f0d050"/>
    </linearGradient>
    <!-- Gold for text -->
    <linearGradient id="goldT" x1="0" y1="300" x2="0" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f5e270"/>
      <stop offset="30%"  stop-color="#d4980e"/>
      <stop offset="60%"  stop-color="#f0d050"/>
      <stop offset="100%" stop-color="#a86a08"/>
    </linearGradient>
    <!-- Highlight shimmer gradient (horizontal) -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#b87808" stop-opacity="1"/>
      <stop offset="30%"  stop-color="#f5e270" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#d4980e" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#f5e270" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b87808" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!--
    ═══════════════════════════════════
    BAAMANN Double-B Geometric Monogram
    ═══════════════════════════════════
    Technique: 3-layer stroke rendering
      Layer 1 – thick gold  (26px) → full body
      Layer 2 – dark center (10px) → carves inner depth
      Layer 3 – bright line ( 3px) → inner metallic highlight
    
    B center-lines (geometric, square-cornered):
      • Spine     : vertical left bar
      • Top       : horizontal, full width
      • Upper-R   : right vertical, upper lobe
      • Mid       : horizontal, mid bar (shorter)
      • Lower-R   : right vertical, lower lobe (4px wider)
      • Bottom    : horizontal, full width
  -->

  <!-- ── Layer 1: Thick gold body ── -->
  <g stroke="url(#goldV)" stroke-width="26" fill="none"
     stroke-linecap="square" stroke-linejoin="miter">
    <!-- Spine -->
    <line x1="148" y1="38"  x2="148" y2="262"/>
    <!-- Top bar -->
    <line x1="148" y1="38"  x2="356" y2="38"/>
    <!-- Upper-right vertical -->
    <line x1="356" y1="38"  x2="356" y2="150"/>
    <!-- Middle bar -->
    <line x1="148" y1="150" x2="340" y2="150"/>
    <!-- Lower-right vertical (step 16px right of upper) -->
    <line x1="372" y1="150" x2="372" y2="262"/>
    <!-- Bottom bar -->
    <line x1="148" y1="262" x2="372" y2="262"/>
  </g>

  <!-- ── Layer 2: Dark center carve – creates engraved depth ── -->
  <g stroke="#050200" stroke-width="10" fill="none"
     stroke-linecap="square" stroke-linejoin="miter" opacity="0.78">
    <line x1="148" y1="38"  x2="148" y2="262"/>
    <line x1="148" y1="38"  x2="356" y2="38"/>
    <line x1="356" y1="38"  x2="356" y2="150"/>
    <line x1="148" y1="150" x2="340" y2="150"/>
    <line x1="372" y1="150" x2="372" y2="262"/>
    <line x1="148" y1="262" x2="372" y2="262"/>
  </g>

  <!-- ── Layer 3: Inner metallic highlight line ── -->
  <g stroke="rgba(255,248,180,0.55)" stroke-width="3" fill="none"
     stroke-linecap="square" stroke-linejoin="miter">
    <line x1="148" y1="38"  x2="148" y2="262"/>
    <line x1="148" y1="38"  x2="356" y2="38"/>
    <line x1="356" y1="38"  x2="356" y2="150"/>
    <line x1="148" y1="150" x2="340" y2="150"/>
    <line x1="372" y1="150" x2="372" y2="262"/>
    <line x1="148" y1="262" x2="372" y2="262"/>
  </g>

  <!-- ══ BAAMANN — gold serif text ══ -->
  <!-- Thin gold rule separator -->
  <line x1="60" y1="305" x2="460" y2="305"
        stroke="url(#goldV)" stroke-width="0.8" opacity="0.5"/>

  <text
    x="260"
    y="365"
    font-family="'Cormorant Garamond','Garamond','Times New Roman',Georgia,serif"
    font-size="58"
    font-weight="700"
    font-style="normal"
    text-anchor="middle"
    fill="url(#shimmer)"
    letter-spacing="10"
    dominant-baseline="auto"
  >BAAMANN</text>
</svg>
